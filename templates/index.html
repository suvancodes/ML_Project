<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 Student Exam Performance Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    .hero {
      text-align: center;
      z-index: 2;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      font-weight: 700;
      font-size: 2.5rem;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    p {
      font-weight: 400;
      font-size: 1.1rem;
      margin: 20px 0 30px;
      color: rgba(255, 255, 255, 0.9);
    }

    .btn-start {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 30px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      text-decoration: none;
    }

    .btn-start:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #36d1dc, #5b86e5);
    }

    /* Floating bubbles background */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bubbles span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      bottom: -150px;
      animation: rise 25s infinite;
      border-radius: 50%;
    }

    .bubbles span:nth-child(1) { left: 10%; width: 25px; height: 25px; animation-delay: 0s; }
    .bubbles span:nth-child(2) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 20s; }
    .bubbles span:nth-child(3) { left: 35%; width: 30px; height: 30px; animation-delay: 4s; }
    .bubbles span:nth-child(4) { left: 50%; width: 20px; height: 20px; animation-delay: 6s; animation-duration: 18s; }
    .bubbles span:nth-child(5) { left: 65%; width: 40px; height: 40px; animation-delay: 3s; }
    .bubbles span:nth-child(6) { left: 75%; width: 10px; height: 10px; animation-delay: 7s; animation-duration: 22s; }
    .bubbles span:nth-child(7) { left: 85%; width: 35px; height: 35px; animation-delay: 5s; }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Floating bubbles -->
  <div class="bubbles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <div class="hero">
    <h1>🎓 Welcome to the Student Exam Performance Predictor</h1>
    <p>Discover your expected exam performance using our smart ML model.  
       Just enter your academic and background details!</p>
    <a href="{{ url_for('predict_datapoint') }}" class="btn-start">🚀 Get Started</a>
  </div>

</body>
</html>
